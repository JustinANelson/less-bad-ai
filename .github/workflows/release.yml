name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          commit="$(git rev-parse --short=12 HEAD)"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X github.com/JustinANelson/less-bad-ai/pkg/cli.Version=$VERSION -X github.com/JustinANelson/less-bad-ai/pkg/cli.Commit=$commit -X github.com/JustinANelson/less-bad-ai/pkg/cli.BuildDate=$built"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            stage="dist/stage_${os}_${arch}"
            mkdir -p "$stage"
            extension=""
            [ "$os" = windows ] && extension=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "$stage/lbai$extension" ./cmd/lbai
            cp "$stage/lbai$extension" "$stage/less-bad-ai$extension"
            if [ "$os" = windows ]; then
              (cd "$stage" && zip -q "../lbai_${os}_${arch}.zip" "lbai$extension" "less-bad-ai$extension")
            else
              tar -C "$stage" -czf "dist/lbai_${os}_${arch}.tar.gz" lbai less-bad-ai
            fi
            rm -rf "$stage"
          done
          (cd dist && sha256sum lbai_* > checksums.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --verify-tag --generate-notes --title "less-bad-ai ${{ github.ref_name }}"
