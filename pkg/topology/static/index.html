<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>less-bad-ai topology</title>
<style>body{font:15px system-ui;margin:0;background:#10141b;color:#e8edf4}header{padding:24px;border-bottom:1px solid #293241}main{padding:24px}.node{display:inline-block;margin:8px;padding:12px 16px;border-radius:8px;background:#26364c}.ui{border-left:5px solid #64d8cb}.data{border-left:5px solid #ffb86b}.core{border-left:5px solid #8aa8ff}button{padding:9px 14px;background:#cf5260;color:white;border:0;border-radius:6px}</style></head>
<body><header><h1>less-bad-ai topology</h1><button id="revert">Revert latest run</button></header><main><div id="graph">Loading…</div><h2>Dependencies</h2><pre id="edges"></pre></main>
<script>let token='';async function load(){const [g,s]=await Promise.all([fetch('/api/topology').then(r=>r.json()),fetch('/api/session').then(r=>r.json())]);token=s.token;document.querySelector('#graph').innerHTML=g.nodes.map(n=>`<span class="node ${n.layer}">${n.id}</span>`).join('');document.querySelector('#edges').textContent=g.edges.map(e=>`${e.source} → ${e.target}`).join('\n')||'No internal edges';}document.querySelector('#revert').onclick=async()=>{if(!confirm('Reset the workspace to its pre-run state?'))return;const r=await fetch('/api/revert',{method:'POST',headers:{'X-LBAI-Token':token}});alert(await r.text());if(r.ok)load()};new EventSource('/api/events').addEventListener('update',load);load();</script></body></html>
