<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>less-bad-ai topology</title>
  <style>
    body{font:15px system-ui;margin:0;background:#10141b;color:#e8edf4}header{padding:24px;border-bottom:1px solid #293241;display:flex;justify-content:space-between;align-items:center}main{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:24px;padding:24px}.panel{background:#171e29;border:1px solid #293241;border-radius:10px;padding:18px}#graph{display:block;width:100%;min-height:420px;background:#101722;border-radius:8px}.edge{stroke:#617087;stroke-width:1.5}.node-label{fill:#e8edf4;font-size:12px;text-anchor:middle}.legend{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--color)}button{padding:9px 14px;background:#cf5260;color:white;border:0;border-radius:6px}dt{color:#9fb0c6;margin-top:14px}dd{margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:760px){main{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><h1>less-bad-ai topology</h1><button id="revert">Revert latest run</button></header>
  <main>
    <section class="panel"><svg id="graph" viewBox="0 0 900 560" role="img" aria-label="Project package dependency graph"></svg><div class="legend"><span style="--color:#64d8cb">UI</span><span style="--color:#8aa8ff">Core</span><span style="--color:#ffb86b">Data</span><span style="--color:#f6d365">Modified ring</span></div><details><summary>Dependency list</summary><pre id="edges"></pre></details></section>
    <aside class="panel"><h2>Latest run</h2><dl><dt>Status</dt><dd id="status">No trace</dd><dt>Prompt excerpt</dt><dd id="prompt">Not available</dd><dt>Worker summary</dt><dd id="summary">Not available</dd><dt>Reviewer modifications</dt><dd id="review">Not available</dd></dl></aside>
  </main>
  <script>
    let token='';
    function setText(id,value,fallback='Not available'){document.querySelector(id).textContent=value||fallback}
    const svgNS='http://www.w3.org/2000/svg';
    function svgElement(name,attributes={}){const element=document.createElementNS(svgNS,name);for(const [key,value] of Object.entries(attributes))element.setAttribute(key,value);return element}
    function renderGraph(nodes,edges){const graph=document.querySelector('#graph');graph.replaceChildren();if(!nodes.length){const empty=svgElement('text',{x:450,y:280,class:'node-label'});empty.textContent='No packages found';graph.appendChild(empty);return}const center={x:450,y:270},radius=Math.min(220,Math.max(110,nodes.length*24)),positions=new Map();nodes.forEach((node,index)=>{const angle=(Math.PI*2*index/nodes.length)-Math.PI/2;positions.set(node.id,{x:center.x+Math.cos(angle)*radius,y:center.y+Math.sin(angle)*radius})});for(const edge of edges){const source=positions.get(edge.source),target=positions.get(edge.target);if(!source||!target)continue;graph.appendChild(svgElement('line',{x1:source.x,y1:source.y,x2:target.x,y2:target.y,class:'edge'}))}const colors={ui:'#64d8cb',core:'#8aa8ff',data:'#ffb86b'};for(const node of nodes){const position=positions.get(node.id),group=svgElement('g'),circle=svgElement('circle',{cx:position.x,cy:position.y,r:28,fill:colors[node.layer]||colors.core,stroke:node.modified?'#f6d365':'#26364c','stroke-width':node.modified?6:2}),label=svgElement('text',{x:position.x,y:position.y+43,class:'node-label'}),title=svgElement('title');label.textContent=node.id.length>28?node.id.slice(0,25)+'...':node.id;title.textContent=node.id+(node.modified?' (modified)':'');group.append(circle,title,label);graph.appendChild(group)}}
    async function load(){const [g,s]=await Promise.all([fetch('/api/topology').then(r=>r.json()),fetch('/api/session').then(r=>r.json())]);token=s.token;renderGraph(g.nodes||[],g.edges||[]);setText('#edges',(g.edges||[]).map(e=>`${e.source} -> ${e.target}`).join('\n'),'No internal edges');setText('#status',g.status,'No trace');setText('#prompt',g.prompt);setText('#summary',g.summary);setText('#review',g.review)}
    document.querySelector('#revert').onclick=async()=>{if(!confirm('Reset the workspace to its pre-run state?'))return;const r=await fetch('/api/revert',{method:'POST',headers:{'X-LBAI-Token':token}});alert(await r.text());if(r.ok)load()};
    new EventSource('/api/events').addEventListener('update',load);
    load();
  </script>
</body>
</html>
